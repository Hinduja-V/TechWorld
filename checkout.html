<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | TechWorld</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-primary-bg text-text-main antialiased selection:bg-accent-primary selection:text-primary-bg flex flex-col min-h-screen">

    <main class="flex-1 py-12">
        <div class="container mx-auto px-4 max-w-6xl">
            <h1 class="text-3xl md:text-2xl font-bold text-text-main mb-8  mt-20">Checkout</h1>
            
            <form id="checkout-form" class="flex flex-col lg:flex-row gap-8">
                <!-- Left: Forms -->
                <div class="w-full lg:w-2/3 space-y-6">
                    
                    <!-- Step 1: Shipping -->
                    <div class="bg-card-bg rounded-3xl shadow-xl border border-border-subtle p-6 md:p-10">
                        <div class="flex items-center gap-4 mb-8">
                            <div class="w-10 h-10 rounded-full bg-primary-bg border border-border-subtle text-accent-primary flex items-center justify-center font-bold shadow-inner drop-shadow-[0_0_10px_rgba(37,99,235,0.2)]">1</div>
                            <h2 class="font-bold text-2xl text-text-main ">Shipping Address</h2>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-bold text-text-secondary mb-2 uppercase ">Full Name *</label>
                                <input type="text" id="ship-name" required class="w-full bg-secondary-bg border border-border-subtle text-text-main rounded-xl px-5 py-3 focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all shadow-inner placeholder-text-secondary/50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-text-secondary mb-2 uppercase ">Phone Number *</label>
                                <input type="tel" id="ship-phone" required pattern="[0-9]{10}" class="w-full bg-secondary-bg border border-border-subtle text-text-main rounded-xl px-5 py-3 focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all shadow-inner placeholder-text-secondary/50">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-bold text-text-secondary mb-2 uppercase ">Address *</label>
                                <input type="text" id="ship-address" required class="w-full bg-secondary-bg border border-border-subtle text-text-main rounded-xl px-5 py-3 focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all shadow-inner placeholder-text-secondary/50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-text-secondary mb-2 uppercase ">City *</label>
                                <input type="text" id="ship-city" required class="w-full bg-secondary-bg border border-border-subtle text-text-main rounded-xl px-5 py-3 focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all shadow-inner placeholder-text-secondary/50">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-text-secondary mb-2 uppercase ">State *</label>
                                <select id="ship-state" required class="w-full bg-secondary-bg border border-border-subtle text-text-main rounded-xl px-5 py-3 focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all shadow-inner appearance-none cursor-pointer">
                                    <option value="">Select State</option>
                                    <option value="Maharashtra">Maharashtra</option>
                                    <option value="Delhi">Delhi</option>
                                    <option value="Karnataka">Karnataka</option>
                                    <option value="Tamil Nadu">Tamil Nadu</option>
                                    <option value="Gujarat">Gujarat</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-text-secondary mb-2 uppercase ">Pincode *</label>
                                <input type="text" id="ship-pin" required pattern="[0-9]{6}" class="w-full bg-secondary-bg border border-border-subtle text-text-main rounded-xl px-5 py-3 focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all shadow-inner placeholder-text-secondary/50">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Step 2: Delivery -->
                    <div class="bg-card-bg rounded-3xl shadow-xl border border-border-subtle p-6 md:p-10">
                        <div class="flex items-center gap-4 mb-8">
                            <div class="w-10 h-10 rounded-full bg-primary-bg border border-border-subtle text-accent-primary flex items-center justify-center font-bold shadow-inner drop-shadow-[0_0_10px_rgba(37,99,235,0.2)]">2</div>
                            <h2 class="font-bold text-2xl text-text-main ">Delivery Method</h2>
                        </div>
                        
                        <div class="space-y-4">
                            <label class="flex items-center p-5 border border-border-subtle rounded-xl cursor-pointer hover:bg-secondary-bg/50 transition-colors has-[:checked]:border-accent-primary has-[:checked]:bg-secondary-bg">
                                <input type="radio" name="delivery" value="Standard" checked class="w-5 h-5 text-accent-primary focus:ring-accent-primary bg-primary-bg border-border-subtle focus:ring-offset-0">
                                <div class="ml-5 flex-1">
                                    <div class="font-bold text-text-main text-lg mb-1">Standard Delivery</div>
                                    <div class="text-sm text-text-secondary">Delivered in 3-5 business days</div>
                                </div>
                                <div class="font-bold text-accent-primary uppercase  text-xs">Complimentary</div>
                            </label>
                            
                            <label class="flex items-center p-5 border border-border-subtle rounded-xl cursor-pointer hover:bg-secondary-bg/50 transition-colors has-[:checked]:border-accent-primary has-[:checked]:bg-secondary-bg">
                                <input type="radio" name="delivery" value="Express" class="w-5 h-5 text-accent-primary focus:ring-accent-primary bg-primary-bg border-border-subtle focus:ring-offset-0">
                                <div class="ml-5 flex-1">
                                    <div class="font-bold text-text-main text-lg mb-1">Priority Logistics</div>
                                    <div class="text-sm text-text-secondary">Delivered in 1-2 business days</div>
                                </div>
                                <div class="font-bold text-text-main text-lg">₹499</div>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Step 3: Payment -->
                    <div class="bg-card-bg rounded-3xl shadow-xl border border-border-subtle p-6 md:p-10">
                        <div class="flex items-center gap-4 mb-8">
                            <div class="w-10 h-10 rounded-full bg-primary-bg border border-border-subtle text-accent-primary flex items-center justify-center font-bold shadow-inner drop-shadow-[0_0_10px_rgba(37,99,235,0.2)]">3</div>
                            <h2 class="font-bold text-2xl text-text-main ">Payment Method</h2>
                        </div>
                        
                        <div class="space-y-4">
                            <label class="flex items-center p-5 border border-border-subtle rounded-xl cursor-pointer hover:bg-secondary-bg/50 transition-colors has-[:checked]:border-accent-primary has-[:checked]:bg-secondary-bg">
                                <input type="radio" name="payment" value="UPI" checked class="w-5 h-5 text-accent-primary focus:ring-accent-primary bg-primary-bg border-border-subtle focus:ring-offset-0">
                                <div class="ml-5 flex-1 flex items-center gap-3">
                                    <i class="fa-solid fa-qrcode text-xl text-accent-primary opacity-80"></i>
                                    <div class="font-bold text-text-main text-lg">Unified Payments Interface</div>
                                </div>
                            </label>
                            
                            <label class="flex items-center p-5 border border-border-subtle rounded-xl cursor-pointer hover:bg-secondary-bg/50 transition-colors has-[:checked]:border-accent-primary has-[:checked]:bg-secondary-bg">
                                <input type="radio" name="payment" value="Card" class="w-5 h-5 text-accent-primary focus:ring-accent-primary bg-primary-bg border-border-subtle focus:ring-offset-0">
                                <div class="ml-5 flex-1 flex items-center gap-3">
                                    <i class="fa-regular fa-credit-card text-xl text-accent-primary opacity-80"></i>
                                    <div class="font-bold text-text-main text-lg">Credit / Debit Card</div>
                                </div>
                            </label>
                            
                            <label class="flex items-center p-5 border border-border-subtle rounded-xl cursor-pointer hover:bg-secondary-bg/50 transition-colors has-[:checked]:border-accent-primary has-[:checked]:bg-secondary-bg">
                                <input type="radio" name="payment" value="COD" class="w-5 h-5 text-accent-primary focus:ring-accent-primary bg-primary-bg border-border-subtle focus:ring-offset-0">
                                <div class="ml-5 flex-1 flex items-center gap-3">
                                    <i class="fa-solid fa-money-bill text-xl text-accent-primary opacity-80"></i>
                                    <div class="font-bold text-text-main text-lg">Cash on Delivery</div>
                                </div>
                            </label>
                        </div>
                        
                        <div class="mt-6 p-5 bg-secondary-bg border border-border-subtle rounded-xl text-sm text-text-secondary flex items-start gap-3">
                            <i class="fa-solid fa-circle-info mt-0.5 text-accent-primary"></i>
                            <p>Note: This is a secure demonstration sandbox. No financial transaction will be processed.</p>
                        </div>
                    </div>
                </div>
                
                <!-- Right: Summary -->
                <div class="w-full lg:w-1/3">
                    <div class="bg-card-bg rounded-3xl shadow-xl border border-border-subtle p-6 md:p-10 sticky top-28">
                        <h2 class="font-bold text-2xl text-text-main mb-8 ">Order Summary</h2>
                        
                        <div id="checkout-items" class="space-y-4 mb-6 max-h-[300px] overflow-y-auto pr-2 custom-scrollbar">
                            <!-- Items injected here -->
                        </div>
                        
                        <div class="border-t border-border-subtle pt-6">
                            <div class="flex justify-between mb-4 text-sm text-text-secondary">
                                <span class="font-medium">Subtotal</span>
                                <span id="checkout-subtotal" class="font-bold text-text-main">₹0</span>
                            </div>
                            <div class="flex justify-between mb-4 text-sm text-text-secondary">
                                <span class="font-medium">Estimated Tax (18%)</span>
                                <span id="checkout-tax" class="font-bold text-text-main">₹0</span>
                            </div>
                            <div class="flex justify-between mb-6 text-sm text-text-secondary">
                                <span class="font-medium">Shipping</span>
                                <span id="checkout-shipping" class="font-bold text-accent-primary uppercase  text-xs">Complimentary</span>
                            </div>
                            
                            <div class="border-t border-border-subtle pt-6 mb-8 flex justify-between items-end">
                                <span class="font-bold text-text-main text-lg">Total</span>
                                <span id="checkout-total" class="font-bold text-3xl text-text-main ">₹0</span>
                            </div>
                            
                            <button type="submit" class="w-full bg-text-main text-primary-bg py-4 rounded-xl font-bold hover:scale-105 transition-transform shadow-[0_0_15px_rgba(0,0,0,0.1)] text-lg flex justify-center items-center gap-3">
                                <i class="fa-solid fa-lock"></i> Complete Order
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        import { initApp, getCart, saveCart, formatPrice, getUser, showToast } from '/js/app.js';

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            
            const cart = getCart();
            if (cart.length === 0) {
                window.location.href = 'cart.html';
                return;
            }
            
            // Pre-fill user data if logged in
            const user = getUser();
            if (user) {
                document.getElementById('ship-name').value = user.name || '';
                document.getElementById('ship-phone').value = user.phone || '';
            }
            
            let subtotal = 0;
            const itemsContainer = document.getElementById('checkout-items');
            
            cart.forEach(item => {
                subtotal += item.price * item.quantity;
                itemsContainer.innerHTML += `
                    <div class="flex gap-4 items-center">
                        <div class="w-16 h-16 bg-primary-bg rounded-xl p-2 flex-shrink-0 flex items-center justify-center border border-border-subtle shadow-inner">
                            <img src="${item.image}" alt="${item.name}" class="max-w-full max-h-full object-contain filter contrast-125">
                        </div>
                        <div class="flex-1 flex flex-col justify-center">
                            <div class="text-sm font-bold text-text-main line-clamp-1">${item.name}</div>
                            <div class="text-xs text-text-secondary mt-1">Qty: ${item.quantity} | ${item.color}</div>
                            <div class="text-sm font-bold text-text-main mt-2 ">${formatPrice(item.price * item.quantity)}</div>
                        </div>
                    </div>
                `;
            });
            
            const renderTotals = () => {
                const deliveryType = document.querySelector('input[name="delivery"]:checked').value;
                const shippingCost = deliveryType === 'Express' ? 499 : 0;
                const tax = Math.round(subtotal * 0.18);
                const total = subtotal + tax + shippingCost;
                
                document.getElementById('checkout-subtotal').textContent = formatPrice(subtotal);
                document.getElementById('checkout-tax').textContent = formatPrice(tax);
                document.getElementById('checkout-shipping').textContent = shippingCost > 0 ? formatPrice(shippingCost) : 'Free';
                document.getElementById('checkout-total').textContent = formatPrice(total);
            };
            
            document.querySelectorAll('input[name="delivery"]').forEach(radio => {
                radio.addEventListener('change', renderTotals);
            });
            
            renderTotals();
            
            // Handle form submission
            document.getElementById('checkout-form').addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Create order object
                const orderId = 'TW' + Date.now().toString().slice(-8);
                const deliveryType = document.querySelector('input[name="delivery"]:checked').value;
                const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
                const shippingCost = deliveryType === 'Express' ? 499 : 0;
                const tax = Math.round(subtotal * 0.18);
                
                const order = {
                    id: orderId,
                    date: new Date().toISOString(),
                    status: 'Processing',
                    items: cart,
                    shipping: {
                        name: document.getElementById('ship-name').value,
                        address: document.getElementById('ship-address').value,
                        city: document.getElementById('ship-city').value,
                        state: document.getElementById('ship-state').value,
                        pin: document.getElementById('ship-pin').value,
                        phone: document.getElementById('ship-phone').value
                    },
                    paymentMethod: paymentMethod,
                    deliveryType: deliveryType,
                    totals: {
                        subtotal,
                        tax,
                        shipping: shippingCost,
                        total: subtotal + tax + shippingCost
                    }
                };
                
                // Save order
                const orders = JSON.parse(localStorage.getItem('techworld_orders')) || [];
                orders.push(order);
                localStorage.setItem('techworld_orders', JSON.stringify(orders));
                
                // Clear cart
                saveCart([]);
                
                // Redirect to success
                window.location.href = `order-tracking.html?id=${orderId}&success=true`;
            });
        });
    </script>
</body>
</html>
