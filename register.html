<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TechWorld</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-primary-bg text-text-main antialiased selection:bg-accent-primary selection:text-primary-bg flex flex-col min-h-screen">

    <main class="flex-1 flex items-center justify-center py-12 px-4 relative">
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute top-[10%] right-[-5%] w-[500px] h-[500px] rounded-full bg-accent-primary/10 blur-[100px]"></div>
            <div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-accent-secondary/10 blur-[100px]"></div>
        </div>

        <div class="bg-card-bg p-8 md:p-12 rounded-3xl shadow-xl border border-border-subtle w-full max-w-lg relative z-10">
            <div class="text-center mb-10">
                <a href="index.html" class="inline-flex items-center gap-2 text-2xl font-bold text-text-main mb-8">
                    <div class="w-8 h-8 rounded-lg bg-accent-primary flex items-center justify-center text-primary-bg">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    TechWorld
                </a>
                <h1 class="text-2xl font-bold text-text-main mb-2 ">Create an Account</h1>
                <p class="text-text-secondary text-sm">Join TechWorld for secure checkout and exclusive access</p>
            </div>
            
            <form id="register-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-text-secondary mb-2 uppercase ">Full Name</label>
                    <input type="text" id="name" required class="w-full bg-secondary-bg border border-border-subtle text-text-main rounded-xl px-5 py-3 focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all shadow-inner placeholder-text-secondary/50">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-text-secondary mb-2 uppercase ">Email Address</label>
                        <input type="email" id="email" required class="w-full bg-secondary-bg border border-border-subtle text-text-main rounded-xl px-5 py-3 focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all shadow-inner placeholder-text-secondary/50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-text-secondary mb-2 uppercase ">Phone Number</label>
                        <input type="tel" id="phone" required pattern="[0-9]{10}" class="w-full bg-secondary-bg border border-border-subtle text-text-main rounded-xl px-5 py-3 focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all shadow-inner placeholder-text-secondary/50">
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-text-secondary mb-2 uppercase ">Password</label>
                    <input type="password" id="password" required minlength="6" class="w-full bg-secondary-bg border border-border-subtle text-text-main rounded-xl px-5 py-3 focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all shadow-inner placeholder-text-secondary/50">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-text-secondary mb-2 uppercase ">Confirm Password</label>
                    <input type="password" id="confirm-password" required minlength="6" class="w-full bg-secondary-bg border border-border-subtle text-text-main rounded-xl px-5 py-3 focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all shadow-inner placeholder-text-secondary/50">
                </div>
                
                <div class="flex items-start mt-4">
                    <div class="flex items-center h-5">
                        <input id="terms" type="checkbox" required class="h-4 w-4 text-accent-primary focus:ring-accent-primary bg-primary-bg border-border-subtle rounded cursor-pointer focus:ring-offset-0">
                    </div>
                    <div class="ml-3 text-sm">
                        <label for="terms" class="font-medium text-text-secondary cursor-pointer">I agree to the <a href="#" class="text-accent-primary hover:text-accent-secondary transition">Terms and Conditions</a></label>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-text-main text-primary-bg py-4 rounded-xl font-bold hover:scale-105 transition-transform shadow-[0_0_15px_rgba(0,0,0,0.1)] mt-6">
                    Create Account
                </button>
            </form>
            
            <p class="mt-10 text-center text-sm text-text-secondary">
                Already have an account? <a href="login.html" class="text-accent-primary font-bold hover:text-accent-secondary transition">Login</a>
            </p>
        </div>
    </main>

    <script type="module">
        import { saveUser, showToast, getUser } from '/js/app.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            if (getUser()) {
                window.location.href = 'account.html';
            }
            
            document.getElementById('register-form').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const phone = document.getElementById('phone').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                
                if (password !== confirmPassword) {
                    showToast('Passwords do not match', 'error');
                    return;
                }
                
                const users = JSON.parse(localStorage.getItem('techworld_users')) || [];
                
                if (users.find(u => u.email === email)) {
                    showToast('Email is already registered', 'error');
                    return;
                }
                
                const newUser = { name, email, phone, password };
                users.push(newUser);
                localStorage.setItem('techworld_users', JSON.stringify(users));
                
                saveUser({ name, email, phone }); // Login automatically
                
                showToast('Registration successful!', 'success');
                setTimeout(() => {
                    window.location.href = 'account.html';
                }, 1000);
            });
        });
    </script>
</body>
</html>
