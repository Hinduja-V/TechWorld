<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking | TechWorld</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/animations.css">
</head>
<body class="bg-primary-bg text-text-main antialiased selection:bg-accent-primary selection:text-primary-bg flex flex-col min-h-screen">

    <main class="flex-1 py-12 flex items-center justify-center">
        <div class="container mx-auto px-4 max-w-3xl">
            
            <div id="success-message" class="hidden text-center mb-10 fade-in-up">
                <div class="w-24 h-24 bg-primary-bg text-green-400 border border-green-500/20 shadow-inner rounded-full flex items-center justify-center text-3xl mx-auto mb-6">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h1 class="text-2xl font-bold text-text-main mb-3 ">Order Placed Successfully!</h1>
                <p class="text-text-secondary font-medium">Thank you for shopping with TechWorld.</p>
            </div>
            
            <div class="bg-card-bg rounded-3xl shadow-xl border border-border-subtle overflow-hidden">
                <div class="bg-secondary-bg/50 p-10 text-center border-b border-border-subtle relative overflow-hidden">
                    <div class="absolute inset-0 bg-accent-primary/5 blur-[50px] rounded-full"></div>
                    <h2 class="text-3xl font-bold text-text-main mb-8  relative z-10">Track Your Order</h2>
                    <form id="track-form" class="flex max-w-md mx-auto relative z-10 shadow-lg rounded-xl overflow-hidden border border-border-subtle">
                        <input type="text" id="track-id" placeholder="Enter Order ID (e.g. TW12345678)" required class="flex-1 px-5 py-4 bg-primary-bg text-text-main placeholder-text-secondary/50 focus:outline-none focus:ring-2 focus:ring-accent-primary/50 transition-all font-medium">
                        <button type="submit" class="bg-text-main text-primary-bg hover:bg-accent-primary transition-colors px-8 py-4 font-bold uppercase  text-sm flex items-center gap-2">
                            Track <i class="fa-solid fa-arrow-right text-xs"></i>
                        </button>
                    </form>
                </div>
                
                <div id="tracking-result" class="p-10 hidden">
                    <!-- Injected via JS -->
                </div>
                
                <div id="tracking-empty" class="p-20 text-center text-text-secondary">
                    <i class="fa-solid fa-box-open text-2xl mb-6 opacity-30 text-accent-primary"></i>
                    <p class="font-medium text-lg">Enter your Order ID above to see tracking details.</p>
                </div>
            </div>
            
            <div class="mt-10 text-center" id="action-buttons">
                <a href="products.html" class="inline-block text-accent-primary font-bold uppercase  text-xs hover:text-accent-secondary transition-colors">Continue Shopping</a>
            </div>
        </div>
    </main>

    <script type="module">
        import { initApp, formatPrice, showToast } from '/js/app.js';

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('id');
            const isSuccess = urlParams.get('success');
            
            if (isSuccess === 'true') {
                document.getElementById('success-message').classList.remove('hidden');
            }
            
            if (orderId) {
                document.getElementById('track-id').value = orderId;
                trackOrder(orderId);
            }
            
            document.getElementById('track-form').addEventListener('submit', (e) => {
                e.preventDefault();
                trackOrder(document.getElementById('track-id').value.trim());
            });
            
            function trackOrder(id) {
                const orders = JSON.parse(localStorage.getItem('techworld_orders')) || [];
                const order = orders.find(o => o.id === id);
                
                const emptyState = document.getElementById('tracking-empty');
                const resultState = document.getElementById('tracking-result');
                
                if (!order) {
                    showToast('Order not found. Please check your ID.', 'error');
                    emptyState.classList.remove('hidden');
                    resultState.classList.add('hidden');
                    return;
                }
                
                emptyState.classList.add('hidden');
                resultState.classList.remove('hidden');
                
                const orderDate = new Date(order.date);
                const deliveryDate = new Date(orderDate);
                deliveryDate.setDate(orderDate.getDate() + (order.deliveryType === 'Express' ? 2 : 5));
                
                resultState.innerHTML = `
                    <div class="flex justify-between items-end border-b border-border-subtle pb-8 mb-10">
                        <div>
                            <div class="text-xs uppercase  text-text-secondary font-bold mb-2">Order ID</div>
                            <div class="text-2xl font-bold text-text-main ">${order.id}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs uppercase  text-text-secondary font-bold mb-2">Estimated Delivery</div>
                            <div class="text-xl font-bold text-accent-primary ">${deliveryDate.toLocaleDateString('en-IN', {day: 'numeric', month: 'short', year: 'numeric'})}</div>
                        </div>
                    </div>
                    
                    <div class="relative py-8 px-4">
                        <!-- Progress Line -->
                        <div class="absolute left-8 top-8 bottom-8 w-[2px] bg-border-subtle rounded-full"></div>
                        <div class="absolute left-8 top-8 h-1/3 w-[2px] bg-accent-primary rounded-full shadow-[0_0_10px_rgba(37,99,235,0.8)]"></div>
                        
                        <!-- Steps -->
                        <div class="relative flex items-center gap-8 mb-14">
                            <div class="w-12 h-12 rounded-full bg-accent-primary text-primary-bg flex items-center justify-center font-bold z-10 ring-4 ring-card-bg shadow-[0_0_15px_rgba(37,99,235,0.4)]">
                                <i class="fa-solid fa-check"></i>
                            </div>
                            <div>
                                <div class="font-bold text-text-main text-xl  mb-1">Order Placed</div>
                                <div class="text-sm font-medium text-text-secondary">${orderDate.toLocaleDateString()} ${orderDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                            </div>
                        </div>
                        
                        <div class="relative flex items-center gap-8 mb-14">
                            <div class="w-12 h-12 rounded-full bg-accent-primary text-primary-bg flex items-center justify-center font-bold z-10 ring-4 ring-card-bg shadow-[0_0_15px_rgba(37,99,235,0.4)]">
                                <i class="fa-solid fa-check"></i>
                            </div>
                            <div>
                                <div class="font-bold text-text-main text-xl  mb-1">Processing</div>
                                <div class="text-sm font-medium text-text-secondary">Your order is being prepared</div>
                            </div>
                        </div>
                        
                        <div class="relative flex items-center gap-8 mb-14 opacity-50 grayscale">
                            <div class="w-12 h-12 rounded-full bg-secondary-bg border border-border-subtle text-text-secondary flex items-center justify-center font-bold z-10 ring-4 ring-card-bg shadow-inner">
                                <i class="fa-solid fa-truck"></i>
                            </div>
                            <div>
                                <div class="font-bold text-text-main text-xl  mb-1">Shipped</div>
                                <div class="text-sm font-medium text-text-secondary uppercase  text-xs">Pending</div>
                            </div>
                        </div>
                        
                        <div class="relative flex items-center gap-8 opacity-50 grayscale">
                            <div class="w-12 h-12 rounded-full bg-secondary-bg border border-border-subtle text-text-secondary flex items-center justify-center font-bold z-10 ring-4 ring-card-bg shadow-inner">
                                <i class="fa-solid fa-house"></i>
                            </div>
                            <div>
                                <div class="font-bold text-text-main text-xl  mb-1">Delivered</div>
                                <div class="text-sm font-medium text-text-secondary uppercase  text-xs">Pending</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-12 bg-primary-bg p-8 rounded-2xl border border-border-subtle shadow-inner">
                        <h3 class="font-bold text-text-main text-xl mb-6 ">Order Summary</h3>
                        <div class="space-y-4 mb-6">
                            ${order.items.map(item => `
                                <div class="flex justify-between items-center text-sm">
                                    <span class="text-text-secondary font-medium"><span class="text-accent-primary font-bold mr-2">${item.quantity}x</span> ${item.name}</span>
                                    <span class="font-bold text-text-main ">${formatPrice(item.price * item.quantity)}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="border-t border-border-subtle pt-5 flex justify-between items-center">
                            <span class="text-text-secondary font-bold uppercase  text-xs">Total Paid via <span class="text-text-main">${order.paymentMethod}</span></span>
                            <span class="text-2xl font-bold text-text-main ">${formatPrice(order.totals.total)}</span>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
