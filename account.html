<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | TechWorld</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-primary-bg text-text-main antialiased selection:bg-accent-primary selection:text-primary-bg flex flex-col min-h-screen">

    <main class="flex-1 py-12">
        <div class="container mx-auto px-4 max-w-6xl">
            
            <div class="flex flex-col md:flex-row gap-8">
                <!-- Sidebar -->
                <aside class="w-full md:w-1/4">
                    <div class="bg-card-bg rounded-3xl shadow-xl border border-border-subtle p-8 sticky top-28">
                        <div class="text-center mb-8 pb-8 border-b border-border-subtle relative">
                            <div class="absolute inset-0 bg-accent-primary/5 blur-[50px] rounded-full"></div>
                            <div class="w-24 h-24 bg-primary-bg text-accent-primary rounded-full border border-border-subtle flex items-center justify-center text-3xl mx-auto mb-4 font-bold shadow-inner relative z-10" id="user-initials">
                                U
                            </div>
                            <h2 class="font-bold text-text-main text-xl  relative z-10" id="user-name">User Name</h2>
                            <p class="text-sm text-text-secondary font-medium relative z-10" id="user-email">user@email.com</p>
                        </div>
                        
                        <nav class="flex flex-col gap-3">
                            <a href="#" class="flex items-center gap-4 px-5 py-4 rounded-xl bg-secondary-bg border border-border-subtle text-accent-primary font-bold transition-all shadow-inner">
                                <i class="fa-solid fa-gauge-high w-5"></i> Dashboard
                            </a>
                            <a href="wishlist.html" class="flex items-center gap-4 px-5 py-4 rounded-xl text-text-secondary hover:bg-secondary-bg/50 hover:text-accent-primary font-medium transition-colors">
                                <i class="fa-regular fa-heart w-5"></i> Wishlist
                            </a>
                            <a href="order-tracking.html" class="flex items-center gap-4 px-5 py-4 rounded-xl text-text-secondary hover:bg-secondary-bg/50 hover:text-accent-primary font-medium transition-colors">
                                <i class="fa-solid fa-box w-5"></i> Track Order
                            </a>
                            <button id="logout-btn" class="flex items-center gap-4 px-5 py-4 rounded-xl text-red-500 hover:bg-red-500/10 hover:text-red-400 font-bold uppercase  text-xs transition-colors text-left mt-6 border border-transparent hover:border-red-500/20">
                                <i class="fa-solid fa-arrow-right-from-bracket w-5"></i> Logout
                            </button>
                        </nav>
                    </div>
                </aside>
                
                <!-- Main Dashboard -->
                <div class="w-full md:w-3/4 space-y-8 mt-10 md:mt-0">
                    <!-- Stats Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <div class="bg-card-bg rounded-3xl p-6 md:p-8 border border-border-subtle shadow-xl flex items-center gap-5">
                            <div class="w-16 h-16 rounded-2xl bg-primary-bg border border-border-subtle shadow-inner text-accent-primary flex items-center justify-center text-2xl">
                                <i class="fa-solid fa-bag-shopping"></i>
                            </div>
                            <div>
                                <div class="text-xs uppercase  text-text-secondary font-bold mb-1">Total Orders</div>
                                <div class="text-3xl font-bold text-text-main " id="stat-orders">0</div>
                            </div>
                        </div>
                        
                        <div class="bg-card-bg rounded-3xl p-6 md:p-8 border border-border-subtle shadow-xl flex items-center gap-5">
                            <div class="w-16 h-16 rounded-2xl bg-primary-bg border border-border-subtle shadow-inner text-red-500 flex items-center justify-center text-2xl">
                                <i class="fa-solid fa-heart"></i>
                            </div>
                            <div>
                                <div class="text-xs uppercase  text-text-secondary font-bold mb-1">Wishlist Items</div>
                                <div class="text-3xl font-bold text-text-main " id="stat-wishlist">0</div>
                            </div>
                        </div>
                        
                        <div class="bg-card-bg rounded-3xl p-6 md:p-8 border border-border-subtle shadow-xl flex items-center gap-5">
                            <div class="w-16 h-16 rounded-2xl bg-primary-bg border border-border-subtle shadow-inner text-green-400 flex items-center justify-center text-2xl">
                                <i class="fa-solid fa-box-open"></i>
                            </div>
                            <div>
                                <div class="text-xs uppercase  text-text-secondary font-bold mb-1">Pending Orders</div>
                                <div class="text-3xl font-bold text-text-main " id="stat-pending">0</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Recent Orders -->
                    <div class="bg-card-bg rounded-3xl shadow-xl border border-border-subtle p-8 md:p-10">
                        <div class="flex justify-between items-center mb-8 border-b border-border-subtle pb-6">
                            <h2 class="font-bold text-2xl text-text-main ">Recent Orders</h2>
                        </div>
                        
                        <div id="orders-container" class="overflow-x-auto custom-scrollbar">
                            <!-- Injected via JS -->
                        </div>
                    </div>
                    
                    <!-- Account Settings Form (Simulated) -->
                    <div class="bg-card-bg rounded-3xl shadow-xl border border-border-subtle p-8 md:p-10">
                        <h2 class="font-bold text-2xl text-text-main mb-8 border-b border-border-subtle pb-6 ">Profile Settings</h2>
                        
                        <form id="profile-form" class="max-w-2xl">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                <div>
                                    <label class="block text-xs font-bold text-text-secondary mb-2 uppercase ">Full Name</label>
                                    <input type="text" id="prof-name" class="w-full bg-secondary-bg border border-border-subtle text-text-main rounded-xl px-5 py-3 focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all shadow-inner placeholder-text-secondary/50">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-text-secondary mb-2 uppercase ">Phone Number</label>
                                    <input type="text" id="prof-phone" class="w-full bg-secondary-bg border border-border-subtle text-text-main rounded-xl px-5 py-3 focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all shadow-inner placeholder-text-secondary/50">
                                </div>
                                <div class="md:col-span-2">
                                    <label class="block text-xs font-bold text-text-secondary mb-2 uppercase ">Email Address (Cannot be changed)</label>
                                    <input type="email" id="prof-email" disabled class="w-full bg-primary-bg border border-border-subtle text-text-secondary rounded-xl px-5 py-3 cursor-not-allowed opacity-70">
                                </div>
                            </div>
                            <button type="submit" class="bg-text-main text-primary-bg px-8 py-4 rounded-xl font-bold hover:scale-105 transition-transform shadow-[0_0_15px_rgba(0,0,0,0.1)]">Save Changes</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initApp, getUser, saveUser, logoutUser, getWishlist, formatPrice, showToast } from '/js/app.js';

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            
            const user = getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            // Set User Details
            document.getElementById('user-name').textContent = user.name || 'User';
            document.getElementById('user-email').textContent = user.email;
            document.getElementById('user-initials').textContent = (user.name || 'U').charAt(0).toUpperCase();
            
            document.getElementById('prof-name').value = user.name || '';
            document.getElementById('prof-phone').value = user.phone || '';
            document.getElementById('prof-email').value = user.email;
            
            document.getElementById('logout-btn').addEventListener('click', logoutUser);
            
            // Profile Save
            document.getElementById('profile-form').addEventListener('submit', (e) => {
                e.preventDefault();
                user.name = document.getElementById('prof-name').value;
                user.phone = document.getElementById('prof-phone').value;
                saveUser(user);
                document.getElementById('user-name').textContent = user.name;
                document.getElementById('user-initials').textContent = user.name.charAt(0).toUpperCase();
                showToast('Profile updated successfully!', 'success');
            });
            
            // Load Orders & Stats
            const orders = JSON.parse(localStorage.getItem('techworld_orders')) || [];
            const wishlist = getWishlist();
            
            document.getElementById('stat-orders').textContent = orders.length;
            document.getElementById('stat-wishlist').textContent = wishlist.length;
            document.getElementById('stat-pending').textContent = orders.filter(o => o.status === 'Processing').length;
            
            const ordersContainer = document.getElementById('orders-container');
            
            if (orders.length === 0) {
                ordersContainer.innerHTML = `
                    <div class="text-center py-10 text-text-secondary">
                        <i class="fa-solid fa-box-open text-3xl mb-4 opacity-50 text-accent-primary"></i>
                        <p class="font-medium text-lg">You haven't placed any orders yet.</p>
                        <a href="products.html" class="inline-block mt-5 text-accent-primary hover:text-accent-secondary font-bold uppercase  text-xs transition-colors">Start Shopping</a>
                    </div>
                `;
            } else {
                let tableHtml = `
                    <table class="w-full text-left whitespace-nowrap">
                        <thead>
                            <tr class="text-text-secondary text-xs uppercase  border-b border-border-subtle">
                                <th class="pb-4 font-bold">Order ID</th>
                                <th class="pb-4 font-bold">Date</th>
                                <th class="pb-4 font-bold">Status</th>
                                <th class="pb-4 font-bold">Total</th>
                                <th class="pb-4 font-bold">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                // Reverse to show newest first
                [...orders].reverse().forEach(order => {
                    const date = new Date(order.date).toLocaleDateString();
                    const statusColor = order.status === 'Processing' ? 'text-accent-primary bg-accent-primary/10 border-accent-primary/20' : 
                                        order.status === 'Shipped' ? 'text-orange-400 bg-orange-400/10 border-orange-400/20' : 
                                        'text-green-400 bg-green-400/10 border-green-400/20';
                                        
                    tableHtml += `
                        <tr class="border-b border-border-subtle last:border-0 hover:bg-secondary-bg/50 transition-colors">
                            <td class="py-5 font-bold text-text-main">${order.id}</td>
                            <td class="py-5 text-text-secondary font-medium">${date}</td>
                            <td class="py-5">
                                <span class="px-4 py-1.5 rounded-full text-xs font-bold uppercase r border ${statusColor}">${order.status}</span>
                            </td>
                            <td class="py-5 font-bold text-text-main ">${formatPrice(order.totals.total)}</td>
                            <td class="py-5">
                                <a href="order-tracking.html?id=${order.id}" class="text-accent-primary hover:text-accent-secondary font-bold uppercase  text-xs transition-colors">Track</a>
                            </td>
                        </tr>
                    `;
                });
                
                tableHtml += `</tbody></table>`;
                ordersContainer.innerHTML = tableHtml;
            }
        });
    </script>
</body>
</html>
