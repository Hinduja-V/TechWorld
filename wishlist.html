<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | TechWorld</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-primary-bg text-text-main antialiased selection:bg-accent-primary selection:text-primary-bg flex flex-col min-h-screen">

    <main class="flex-1 py-12">
        <div class="container mx-auto px-4 max-w-6xl">
            <h1 class="text-3xl md:text-2xl font-bold text-text-main mb-8  mt-20">My Wishlist</h1>
            
            <div id="wishlist-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Products injected via JS -->
            </div>
            
            <div id="wishlist-empty" class="hidden w-full bg-card-bg p-16 rounded-3xl shadow-xl border border-border-subtle flex flex-col items-center text-center mt-10">
                <div class="w-32 h-32 bg-primary-bg rounded-full border border-border-subtle flex items-center justify-center text-red-500 text-3xl mb-6 shadow-inner drop-shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                    <i class="fa-regular fa-heart"></i>
                </div>
                <h2 class="text-2xl font-bold text-text-main mb-3 ">Your wishlist is empty</h2>
                <p class="text-text-secondary mb-10 max-w-md">Save items you love to your wishlist and buy them later when you're ready.</p>
                <a href="products.html" class="bg-text-main text-primary-bg px-8 py-4 rounded-full font-bold hover:scale-105 transition-transform shadow-[0_0_15px_rgba(0,0,0,0.1)]">Discover Products</a>
            </div>
        </div>
    </main>

    <script type="module">
        import { initApp, getWishlist, createProductCard } from '/js/app.js';

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            
            const renderWishlist = () => {
                const wishlist = getWishlist();
                const container = document.getElementById('wishlist-container');
                const emptyState = document.getElementById('wishlist-empty');
                
                container.innerHTML = '';
                
                if (wishlist.length === 0) {
                    container.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    emptyState.classList.add('flex');
                } else {
                    container.classList.remove('hidden');
                    emptyState.classList.add('hidden');
                    emptyState.classList.remove('flex');
                    
                    wishlist.forEach(product => {
                        const card = createProductCard(product);
                        // Add listener to the heart icon to re-render when removed
                        const btn = card.querySelector('.wishlist-btn');
                        btn.addEventListener('click', () => {
                            setTimeout(renderWishlist, 50); // slight delay to allow app.js to update storage first
                        });
                        container.appendChild(card);
                    });
                }
            };
            
            renderWishlist();
        });
    </script>
</body>
</html>
