<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | TechWorld</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-primary-bg text-text-main antialiased selection:bg-accent-primary selection:text-primary-bg flex flex-col min-h-screen">

    <main class="flex-1 py-8">
        <div class="container mx-auto px-4" id="product-container">
            <!-- Breadcrumbs -->
            <div class="text-xs font-bold  uppercase text-text-secondary mb-8 mt-10" id="breadcrumbs">
                <!-- Injected via JS -->
            </div>
            
            <!-- Main Content will be injected here -->
            <div id="product-content" class="min-h-[500px] flex items-center justify-center">
                <div class="loader"></div>
            </div>
            
        </div>
    </main>

    <script type="module">
        import { initApp, addToCart, toggleWishlist, addToCompare, formatPrice, createProductCard, showToast } from '/js/app.js';
        import products from '/js/products.js';

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));
            const product = products.find(p => p.id === productId);
            
            if (!product) {
                document.getElementById('product-content').innerHTML = `
                    <div class="text-center py-20">
                        <h2 class="text-2xl font-bold text-text-main mb-4 ">Product Not Found</h2>
                        <a href="products.html" class="text-accent-primary hover:text-accent-secondary font-bold uppercase  text-xs transition-colors">Back to Shop</a>
                    </div>
                `;
                return;
            }
            
            // Set title and breadcrumbs
            document.title = `${product.name} | TechWorld`;
            document.getElementById('breadcrumbs').innerHTML = `
                <a href="index.html" class="hover:text-accent-primary transition-colors">Home</a> <i class="fa-solid fa-chevron-right text-xs mx-2 opacity-50"></i> 
                <a href="products.html?category=${product.category}" class="hover:text-accent-primary transition-colors">${product.category}</a> <i class="fa-solid fa-chevron-right text-xs mx-2 opacity-50"></i>
                <span class="text-text-main font-medium">${product.name}</span>
            `;
            
            let selectedColor = product.colors[0];
            let quantity = 1;
            
            // Render main product
            const renderProduct = () => {
                const specRows = Object.entries(product.specifications).map(([key, val]) => {
                    if(val === 'N/A') return '';
                    return `
                    <tr class="border-b border-border-subtle last:border-0">
                        <td class="py-4 text-text-secondary capitalize w-1/3 font-medium  text-sm">${key}</td>
                        <td class="py-4 font-bold text-text-main">${val}</td>
                    </tr>
                    `;
                }).join('');
                
                const featuresList = product.features.map(f => `<li class="flex items-start gap-3 mb-3"><div class="mt-1 w-4 h-4 rounded-full bg-accent-primary/20 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-check text-xs text-accent-primary"></i></div> <span class="font-medium">${f}</span></li>`).join('');

                const colorBtns = product.colors.map(c => `
                    <button class="color-btn border ${selectedColor === c ? 'border-accent-primary ring-2 ring-accent-primary bg-secondary-bg text-text-main' : 'border-border-subtle text-text-secondary hover:border-accent-primary hover:text-text-main'} rounded-xl px-4 py-2 text-sm font-bold  transition-all" data-color="${c}">${c}</button>
                `).join('');

                document.getElementById('product-content').innerHTML = `
                    <div class="flex flex-col lg:flex-row gap-12 bg-card-bg p-8 md:p-12 rounded-3xl shadow-xl border border-border-subtle mb-16">
                        <!-- Left: Images -->
                        <div class="w-full lg:w-1/2 flex flex-col">
                            <div class="bg-primary-bg rounded-2xl p-10 mb-6 relative aspect-square flex items-center justify-center zoom-wrapper border border-border-subtle shadow-inner">
                                ${product.discount > 0 ? `<div class="absolute top-6 left-6 bg-accent-primary text-primary-bg text-xs font-bold px-4 py-2 rounded-full shadow-[0_0_15px_rgba(37,99,235,0.4)] ">-${product.discount}% OFF</div>` : ''}
                                <img src="${product.image}" id="main-image" class="zoom-image max-w-full max-h-full object-contain filter contrast-125 drop-shadow-xl" alt="${product.name}">
                            </div>
                            <div class="flex gap-4 overflow-x-auto pb-2 custom-scrollbar">
                                ${product.images.map(img => `
                                    <button class="w-24 h-24 rounded-2xl border-2 border-transparent focus:border-accent-primary bg-primary-bg p-3 flex-shrink-0 thumbnail-btn shadow-inner border border-border-subtle hover:scale-105 transition-transform">
                                        <img src="${img}" class="w-full h-full object-contain filter contrast-125" alt="Thumbnail">
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                        
                        <!-- Right: Info -->
                        <div class="w-full lg:w-1/2 flex flex-col justify-center">
                            <div class="text-xs font-bold text-text-secondary uppercase  mb-3 flex items-center gap-2">
                                <span class="w-8 h-[1px] bg-accent-primary"></span>
                                ${product.brand}
                            </div>
                            <h1 class="text-5xl lg:text-6xl font-bold text-text-main mb-6  leading-tight">${product.name}</h1>
                            
                            <div class="flex items-center gap-5 mb-8">
                                <div class="flex items-center gap-1 text-accent-secondary text-sm">
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid fa-star"></i>
                                    <i class="fa-solid ${product.rating >= 4.8 ? 'fa-star' : 'fa-star-half-stroke'}"></i>
                                </div>
                                <div class="text-text-secondary text-sm font-medium"><span class="font-bold text-text-main">${product.rating}</span> (${product.reviewCount} Reviews)</div>
                            </div>
                            
                            <div class="flex items-end gap-4 mb-8 pb-8 border-b border-border-subtle">
                                <div class="text-5xl font-bold text-text-main ">${formatPrice(product.price)}</div>
                                ${product.oldPrice > product.price ? `<div class="text-4xl text-text-secondary line-through font-medium mb-1 opacity-60">${formatPrice(product.oldPrice)}</div>` : ''}
                            </div>
                            
                            <div class="mb-8">
                                <div class="flex justify-between items-center mb-4">
                                    <h4 class="font-bold text-text-main text-sm uppercase r">Color: <span id="selected-color-label" class="font-medium text-accent-primary">${selectedColor}</span></h4>
                                </div>
                                <div class="flex gap-3 flex-wrap">
                                    ${colorBtns}
                                </div>
                            </div>
                            
                            <div class="mb-10">
                                <div class="flex justify-between items-center mb-4">
                                    <h4 class="font-bold text-text-main text-sm uppercase r">Quantity</h4>
                                    <div class="text-sm font-bold uppercase  ${product.stockStatus === 'In Stock' ? 'text-green-400' : product.stockStatus === 'Low Stock' ? 'text-orange-400' : 'text-red-500'}">
                                        <i class="fa-solid fa-circle text-xs mr-2 align-middle"></i> ${product.stockStatus} ${product.stock > 0 ? `(${product.stock} available)` : ''}
                                    </div>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="flex items-center border border-border-subtle bg-secondary-bg/50 rounded-xl w-36 h-14">
                                        <button id="qty-dec" class="w-12 h-full flex items-center justify-center text-text-secondary hover:text-accent-primary hover:bg-primary-bg transition-colors rounded-l-xl ${product.stock === 0 ? 'opacity-50 cursor-not-allowed' : ''}">-</button>
                                        <input type="number" id="qty-input" value="1" min="1" max="${product.stock}" class="w-12 h-full text-center border-0 bg-transparent focus:ring-0 text-text-main font-bold text-lg p-0" ${product.stock === 0 ? 'disabled' : ''}>
                                        <button id="qty-inc" class="w-12 h-full flex items-center justify-center text-text-secondary hover:text-accent-primary hover:bg-primary-bg transition-colors rounded-r-xl ${product.stock === 0 ? 'opacity-50 cursor-not-allowed' : ''}">+</button>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex flex-col sm:flex-row gap-4 mb-8">
                                <button id="add-to-cart-btn" class="flex-1 bg-secondary-bg border border-border-subtle text-text-main h-16 rounded-xl font-bold hover:bg-border-subtle hover:text-accent-primary transition-all flex items-center justify-center gap-3 ${product.stock === 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${product.stock === 0 ? 'disabled' : ''}>
                                    <i class="fa-solid fa-cart-plus"></i> Add to Cart
                                </button>
                                <button id="buy-now-btn" class="flex-1 bg-text-main text-primary-bg h-16 rounded-xl font-bold hover:scale-105 transition-transform shadow-[0_0_15px_rgba(0,0,0,0.1)] flex items-center justify-center gap-3 ${product.stock === 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${product.stock === 0 ? 'disabled' : ''}>
                                    <i class="fa-solid fa-bolt text-accent-primary"></i> Buy Now
                                </button>
                            </div>
                            
                            <div class="flex gap-8 pt-6 border-t border-border-subtle">
                                <button id="add-wishlist-btn" class="flex items-center gap-3 text-text-secondary hover:text-red-500 font-bold uppercase  text-xs transition-colors">
                                    <i class="fa-regular fa-heart text-lg"></i> Add to Wishlist
                                </button>
                                <button id="add-compare-btn" class="flex items-center gap-3 text-text-secondary hover:text-accent-primary font-bold uppercase  text-xs transition-colors">
                                    <i class="fa-solid fa-code-compare text-lg"></i> Compare
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Tabs -->
                    <div class="bg-card-bg rounded-3xl shadow-xl border border-border-subtle overflow-hidden mb-16">
                        <div class="flex border-b border-border-subtle overflow-x-auto custom-scrollbar">
                            <button class="px-10 py-6 font-bold text-accent-primary border-b-2 border-accent-primary whitespace-nowrap uppercase  text-xs">Description & Features</button>
                            <button class="px-10 py-6 font-bold text-text-secondary hover:text-text-main whitespace-nowrap uppercase  text-xs transition-colors">Specifications</button>
                            <button class="px-10 py-6 font-bold text-text-secondary hover:text-text-main whitespace-nowrap uppercase  text-xs transition-colors">Reviews (${product.reviewCount})</button>
                        </div>
                        <div class="p-8 md:p-12">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
                                <div>
                                    <h3 class="text-2xl font-bold text-text-main mb-6 ">Product Description</h3>
                                    <p class="text-text-secondary leading-relaxed font-medium">${product.description}</p>
                                </div>
                                <div>
                                    <h3 class="text-2xl font-bold text-text-main mb-6 ">Key Features</h3>
                                    <ul class="text-text-secondary">
                                        ${featuresList}
                                    </ul>
                                </div>
                            </div>
                            
                            <div class="mt-16 pt-12 border-t border-border-subtle">
                                <h3 class="text-2xl font-bold text-text-main mb-8 ">Technical Specifications</h3>
                                <table class="w-full text-left bg-secondary-bg/30 rounded-xl overflow-hidden">
                                    <tbody>
                                        ${specRows}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Related Products -->
                    <div class="mb-16">
                        <h3 class="text-2xl font-bold text-text-main mb-10 ">Related Products</h3>
                        <div id="related-products" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
                    </div>
                `;

                // Add Event Listeners for new DOM
                document.querySelectorAll('.color-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.color-btn').forEach(b => {
                            b.classList.remove('border-accent-primary', 'ring-2', 'ring-accent-primary', 'bg-secondary-bg', 'text-text-main');
                            b.classList.add('border-border-subtle', 'text-text-secondary');
                        });
                        e.target.classList.remove('border-border-subtle', 'text-text-secondary');
                        e.target.classList.add('border-accent-primary', 'ring-2', 'ring-accent-primary', 'bg-secondary-bg', 'text-text-main');
                        selectedColor = e.target.dataset.color;
                        document.getElementById('selected-color-label').textContent = selectedColor;
                    });
                });
                
                const qtyInput = document.getElementById('qty-input');
                document.getElementById('qty-inc').addEventListener('click', () => {
                    if (product.stock === 0) return;
                    if (quantity < product.stock) {
                        quantity++;
                        qtyInput.value = quantity;
                    }
                });
                document.getElementById('qty-dec').addEventListener('click', () => {
                    if (product.stock === 0) return;
                    if (quantity > 1) {
                        quantity--;
                        qtyInput.value = quantity;
                    }
                });

                document.getElementById('add-to-cart-btn').addEventListener('click', () => {
                    addToCart(product, quantity, { color: selectedColor });
                });
                
                document.getElementById('buy-now-btn').addEventListener('click', () => {
                    addToCart(product, quantity, { color: selectedColor });
                    window.location.href = 'checkout.html';
                });
                
                document.getElementById('add-wishlist-btn').addEventListener('click', (e) => {
                    toggleWishlist(product);
                    const icon = e.currentTarget.querySelector('i');
                    icon.classList.toggle('fa-regular');
                    icon.classList.toggle('fa-solid');
                    icon.classList.toggle('text-red-500');
                });
                
                document.getElementById('add-compare-btn').addEventListener('click', () => {
                    addToCompare(product);
                });
                
                // Related products
                const relatedContainer = document.getElementById('related-products');
                const related = products.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);
                related.forEach(p => {
                    relatedContainer.appendChild(createProductCard(p));
                });
            };
            
            renderProduct();
        });
    </script>
</body>
</html>
