<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | TechWorld</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-primary-bg text-text-main antialiased selection:bg-accent-primary selection:text-primary-bg flex flex-col min-h-screen">

    <main class="flex-1 py-12">
        <div class="container mx-auto px-4 max-w-6xl">
            <h1 class="text-3xl md:text-2xl font-bold text-text-main mb-8  mt-20">Shopping Cart</h1>
            
            <div id="cart-container" class="flex flex-col lg:flex-row gap-8">
                <!-- Cart content will be injected here via JS -->
            </div>
        </div>
    </main>

    <script type="module">
        import { initApp, getCart, saveCart, formatPrice, showToast } from '/js/app.js';

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            
            const renderCart = () => {
                const cart = getCart();
                const container = document.getElementById('cart-container');
                
                if (cart.length === 0) {
                    container.innerHTML = `
                        <div class="w-full bg-card-bg p-16 rounded-3xl shadow-xl border border-border-subtle flex flex-col items-center text-center">
                            <div class="w-32 h-32 bg-primary-bg rounded-full border border-border-subtle flex items-center justify-center text-accent-primary text-3xl mb-6 shadow-inner drop-shadow-[0_0_15px_rgba(37,99,235,0.2)]">
                                <i class="fa-solid fa-cart-shopping"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-text-main mb-3 ">Your cart is empty</h2>
                            <p class="text-text-secondary mb-10 max-w-md">Looks like you haven't added anything to your cart yet. Discover our latest technology products.</p>
                            <a href="products.html" class="bg-text-main text-primary-bg px-8 py-4 rounded-full font-bold hover:scale-105 transition-transform shadow-[0_0_15px_rgba(0,0,0,0.1)]">Explore Collection</a>
                        </div>
                    `;
                    return;
                }
                
                let subtotal = 0;
                
                const cartItemsHtml = cart.map((item, index) => {
                    subtotal += item.price * item.quantity;
                    return `
                        <div class="flex flex-col sm:flex-row items-center gap-6 py-8 border-b border-border-subtle last:border-0 relative group">
                            <button class="remove-btn absolute top-6 right-0 text-text-secondary hover:text-red-500 transition-colors" data-index="${index}" title="Remove Item">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                            <a href="product-details.html?id=${item.id}" class="w-24 h-24 sm:w-32 sm:h-32 bg-primary-bg rounded-2xl p-4 flex-shrink-0 flex items-center justify-center border border-border-subtle shadow-inner">
                                <img src="${item.image}" alt="${item.name}" class="max-w-full max-h-full object-contain filter contrast-125 drop-shadow-lg group-hover:scale-105 transition-transform">
                            </a>
                            <div class="flex-1 text-center sm:text-left pr-8">
                                <div class="text-xs text-text-secondary font-bold  uppercase mb-1">${item.brand}</div>
                                <h3 class="font-bold text-text-main text-2xl mb-1 leading-snug"><a href="product-details.html?id=${item.id}" class="hover:text-accent-primary transition-colors">${item.name}</a></h3>
                                <p class="text-sm text-text-secondary mb-4">Color: <span class="text-text-main font-medium">${item.color}</span></p>
                                <div class="font-bold text-text-main text-2xl hidden sm:block">${formatPrice(item.price)}</div>
                            </div>
                            <div class="flex flex-col items-center sm:items-end gap-4">
                                <div class="font-bold text-text-main text-2xl sm:hidden">${formatPrice(item.price)}</div>
                                <div class="flex items-center border border-border-subtle rounded-xl h-12 w-32 bg-secondary-bg/50">
                                    <button class="qty-btn dec w-10 h-full flex items-center justify-center text-text-secondary hover:text-accent-primary hover:bg-primary-bg transition-colors rounded-l-xl" data-index="${index}">-</button>
                                    <input type="number" value="${item.quantity}" class="w-12 h-full text-center border-0 bg-transparent focus:ring-0 text-text-main font-bold text-sm p-0" readonly>
                                    <button class="qty-btn inc w-10 h-full flex items-center justify-center text-text-secondary hover:text-accent-primary hover:bg-primary-bg transition-colors rounded-r-xl" data-index="${index}">+</button>
                                </div>
                                <div class="font-bold text-text-main text-3xl ">${formatPrice(item.price * item.quantity)}</div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                const tax = Math.round(subtotal * 0.18); // Simulated 18% tax
                const total = subtotal + tax;
                
                container.innerHTML = `
                    <div class="w-full lg:w-2/3">
                        <div class="bg-card-bg rounded-3xl shadow-xl border border-border-subtle p-6 md:p-10">
                            <div class="flex justify-between items-end border-b border-border-subtle pb-6 mb-4">
                                <h2 class="font-bold text-2xl text-text-main ">Cart Items (${cart.length})</h2>
                            </div>
                            <div>
                                ${cartItemsHtml}
                            </div>
                        </div>
                    </div>
                    
                    <div class="w-full lg:w-1/3">
                        <div class="bg-card-bg rounded-3xl shadow-xl border border-border-subtle p-6 md:p-10 sticky top-28">
                            <h2 class="font-bold text-2xl text-text-main mb-8 ">Order Summary</h2>
                            
                            <div class="flex justify-between mb-5 text-text-secondary">
                                <span class="font-medium">Subtotal</span>
                                <span class="font-bold text-text-main">${formatPrice(subtotal)}</span>
                            </div>
                            <div class="flex justify-between mb-5 text-text-secondary">
                                <span class="font-medium">Estimated Tax (18%)</span>
                                <span class="font-bold text-text-main">${formatPrice(tax)}</span>
                            </div>
                            <div class="flex justify-between mb-5 text-text-secondary">
                                <span class="font-medium">Shipping</span>
                                <span class="font-bold text-accent-primary uppercase  text-xs mt-1">Complimentary</span>
                            </div>
                            
                            <div class="border-t border-border-subtle pt-6 mt-6 mb-10 flex justify-between items-end">
                                <span class="font-bold text-text-main text-lg">Total</span>
                                <span class="font-bold text-5xl text-text-main ">${formatPrice(total)}</span>
                            </div>
                            
                            <a href="checkout.html" class="block w-full text-center bg-text-main text-primary-bg py-4 rounded-xl font-bold hover:scale-105 transition-transform shadow-[0_0_15px_rgba(0,0,0,0.1)] mb-4">
                                Proceed to Checkout
                            </a>
                            <a href="products.html" class="block w-full text-center text-text-secondary py-4 rounded-xl font-medium hover:text-accent-primary hover:bg-secondary-bg/50 transition-colors">
                                Continue Shopping
                            </a>
                        </div>
                    </div>
                `;
                
                // Add event listeners
                document.querySelectorAll('.remove-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const index = e.currentTarget.dataset.index;
                        cart.splice(index, 1);
                        saveCart(cart);
                        showToast('Item removed from cart', 'info');
                        renderCart();
                    });
                });
                
                document.querySelectorAll('.qty-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const index = e.currentTarget.dataset.index;
                        const isInc = e.currentTarget.classList.contains('inc');
                        
                        if (isInc) {
                            if (cart[index].quantity < cart[index].stock) {
                                cart[index].quantity++;
                                saveCart(cart);
                                renderCart();
                            } else {
                                showToast('Maximum stock reached', 'error');
                            }
                        } else {
                            if (cart[index].quantity > 1) {
                                cart[index].quantity--;
                                saveCart(cart);
                                renderCart();
                            }
                        }
                    });
                });
            };
            
            renderCart();
        });
    </script>
</body>
</html>
